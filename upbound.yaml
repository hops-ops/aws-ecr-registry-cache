apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: aws-ecr-registry-cache
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.3'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-aws-ecr
    version: '>=v2.5.0'
  description: Creates ECR pull-through cache rules, optional repository creation
    templates, and optional enhanced scanning for platform image registries.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # aws-ecr-registry-cache
    ECR pull-through cache rules for platform image registries.
  repository: ghcr.io/hops-ops/aws-ecr-registry-cache
  source: github.com/hops-ops/aws-ecr-registry-cache
